# xnu kernel build on Codemagic (Mac mini M2), the same steps as
# .github/workflows/xnu.yml. Codemagic removed its Xcode 15 machines in
# November 2025, so this builds with Xcode 16.0: patch 0140 gives xnu-8796
# the IORPC.kernelContent field Xcode 16's iig output uses. Start it by hand
# (Start new build -> workflow "xnu"); artifacts: out/ (the kernel),
# build.log, buildtree.tgz (for tools/xnu-cc.py local compiles).
workflows:
  xnu:
    name: xnu kernel
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: "16.0"
      vars:
        DXB_REPO: https://github.com/blacktop/darwin-xnu-build
        DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
        MACOS_VERSION: "13.5"           # xnu-8796, the iOS 16 generation
        KERNEL_CONFIG: DEVELOPMENT
        MACHINE_CONFIG: SWEET
        KEEP_GOING: "true"              # make -k: one run reports every compile error
        CCACHE_COMPILERCHECK: content
        CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
        CCACHE_MAXSIZE: 3G
        # The Xcode 16.0 image runs a macOS Homebrew no longer has bottles for:
        # every install or upgrade builds from source (cmake alone takes ages)
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_UPGRADE: "1"
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
    cache:
      cache_paths:
        - ~/.ccache
    scripts:
      - name: Fetch build script
        script: |
          set -euo pipefail
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # Cortex-A53/A73 (ARMv8.0), so the same -mcpu as the kernel
          # (clang's apple-m1 default emits LSE atomics and LDAPR)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        script: |
          set -euo pipefail
          BIN=$(brew --prefix)/bin
          # build.sh really runs only jq; bash is the shell it wants. Install
          # those if missing (small even from source), nothing else.
          command -v jq > /dev/null || brew install jq
          [ -x "$BIN/bash" ] || brew install bash
          # install_deps only checks that these exist (and brew-installs all of
          # them if one is missing): gum is for the interactive version menu,
          # xcodes for installing Xcode, cmake and ninja are not used
          for f in gum xcodes cmake ninja; do
            if ! command -v "$f" > /dev/null; then
              printf '#!/bin/sh\nexit 0\n' > "$BIN/$f"
              chmod +x "$BIN/$f"
              echo "stub $f"
            fi
          done
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --find iig
          # every step is its own shell: hand the ccache setup to the next ones
          echo "CCACHE_DIR=$HOME/.ccache" >> "$CM_ENV"
          echo "CCACHE_BASEDIR=$CM_BUILD_DIR" >> "$CM_ENV"
          echo "CCACHE_WRAP=$CM_BUILD_DIR/ccache-bin" >> "$CM_ENV"
          # ccache only if the image already has it: building it from source
          # costs more than it saves
          CCACHE=$(command -v ccache || true)
          mkdir -p "$CM_BUILD_DIR/ccache-bin"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec %s %s "$@"\n' "$CCACHE" "$(xcrun -find $t)" > "$CM_BUILD_DIR/ccache-bin/$t"
            chmod +x "$CM_BUILD_DIR/ccache-bin/$t"
          done
          cat "$CM_BUILD_DIR/ccache-bin/clang"

      # A failed build must not stop the workflow: the log and whatever was
      # built are the artifacts; "Result" says how it went.
      - name: Build
        ignore_failure: true
        script: |
          set -uo pipefail
          cd dxb
          if [ "$KEEP_GOING" = true ]; then export MAKEFLAGS=-k; fi
          ccache -z || true
          bash build.sh 2>&1 | tee "$CM_BUILD_DIR/build.log"
          echo "${PIPESTATUS[0]}" > "$CM_BUILD_DIR/build.status"
          ccache -s || true

      - name: Package build tree for local compiles
        ignore_failure: true
        script: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - name: Collect
        ignore_failure: true
        script: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - name: Result
        script: |
          st=$(cat build.status 2>/dev/null || echo none)
          if ls out/kernel.* > /dev/null 2>&1; then
            echo "KERNEL BUILT (build.sh exit $st)"
            ls -la out
          else
            echo "NO KERNEL (build.sh exit $st). First errors:"
            grep -n -E 'error:|\*\*\* \[|Error [0-9]+' build.log | head -150 || true
          fi

    artifacts:
      - out/**
      - build.log
      - buildtree.tgz
